services:
  n8n:
    image: n8nio/n8n:latest
    restart: always
    ports:
      - "${N8N_PORT}:${N8N_PORT}"
    depends_on:
      - postgres
      - redis
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=${N8N_PORT}
      - N8N_PROTOCOL=https
      # Public URL of the editor. Without it n8n builds links (OAuth callbacks,
      # the MCP endpoints, invite mails) from its own container address, which
      # is unreachable from outside.
      - N8N_EDITOR_BASE_URL=https://${N8N_HOST}
      # Two proxies sit in front of n8n: the Cloudflare edge, then the
      # cloudflared container. Without this, Express keeps trust proxy off,
      # rejects the X-Forwarded-For they set, and rate limiting counts every
      # request as coming from one client.
      - N8N_PROXY_HOPS=2
      - WEBHOOK_URL=${WEBHOOK_URL}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n

  postgres:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel run
    depends_on:
      - n8n
    volumes:
      - ./cloudflared:/etc/cloudflared

volumes:
  n8n_data:
  postgres_data:
  redis_data:
